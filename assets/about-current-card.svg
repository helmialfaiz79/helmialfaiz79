  <text x="620" y="131" fill="#c9d1d9" font-family="sans-serif" font-size="18">Linux administration & services</text>

  <circle cx="604" cy="152" r="5" fill="#39d353"/>
  <text x="620" y="158" fill="#c9d1d9" font-family="sans-serif" font-size="18">GitHub Actions / CI/CD pipelines</text>

  <circle cx="604" cy="179" r="5" fill="#39d353"/>
  <text x="620" y="185" fill="#c9d1d9" font-family="sans-serif" font-size="18">Nginx, PM2, deployments, logs</text>

  <circle cx="604" cy="206" r="5" fill="#39d353"/>
  <text x="620" y="212" fill="#c9d1d9" font-family="sans-serif" font-size="18">Object storage migration with rclone</text>
